services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmf
      POSTGRES_PASSWORD: mmf
      POSTGRES_DB: mmf
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mmf']
      interval: 10s
      timeout: 5s
      retries: 5

# Server environment variables required when running the Node.js server:
#   DATABASE_URL=postgres://mmf:mmf@localhost:5432/mmf
#   PORT=3001
#   JWT_SECRET=change-me-in-production  <-- REQUIRED for JWT auth middleware
# If a server service is added to this compose file, include:
#   environment:
#     JWT_SECRET: change-me-in-production

volumes:
  pgdata:
