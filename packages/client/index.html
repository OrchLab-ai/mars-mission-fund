<!doctype html>
<html lang="en" style="background: #060a14">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mars Mission Fund — Crowdfunding humanity's journey to Mars"
    />
    <meta name="theme-color" content="#060A14" />
    <!-- Declared inline as a data URI so there is no /favicon.ico request to 404,
         and no binary asset to carry. Browsers request /favicon.ico by default when
         a page declares no icon, and that 404 is the only console error the app
         produces on a clean load. The workshop's agent-sight activity asks an agent
         to report what it sees in the console; a permanent, harmless error there
         teaches attendees to discount exactly the reports that activity is about. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23060a14'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='8'%20fill='%23ff5c1a'/%3E%3C/svg%3E"
    />
    <title>Mars Mission Fund</title>
    <link
      rel="preload"
      href="/src/assets/fonts/dm-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <noscript>Mars Mission Fund requires JavaScript to be enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
